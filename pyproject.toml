[project]
name = "mole"
version = "0.1.0"
description = "Dig deep like a mole to optimize you Mac"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wox-plugin==0.0.73",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
